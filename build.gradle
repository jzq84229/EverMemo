plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.0'
}

repositories {
    maven {url("https://maven.aliyun.com/repository/google")}
    maven {url("https://maven.aliyun.com/repository/public")}
    google()
    mavenCentral()
    mavenLocal()
}

ext.compileSdkVersion=34
ext.buildToolsVersion="34.0.0"

android {
    namespace 'com.zhan_dui.evermemo'
    compileSdkVersion 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.zhan_dui.evermemo"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 7
        versionName "1.1.2"

        buildConfigField "String", "EVERNOTE_CONSUMER_KEY", "\"milkliker\""
        buildConfigField "String", "EVERNOTE_CONSUMER_SECRET", "\"f479109c186d284b\""

        manifestPlaceholders = [
            UMENG_APPKEY: "5227d49556240bb56e0b9713",
            UMENG_CHANNEL: "Wan_Dou_Jia"
        ]
    }

    lintOptions {
          abortOnError false
    }
    sourceSets {
        main{
            assets {
                srcDir 'src/main/assets'
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation fileTree(dir: 'src/main/libs', include: '*.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.0'
    annotationProcessor 'androidx.room:room-compiler:2.6.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation project(':libraries:EverNoteEx')
    implementation project(':libraries:ExGridView')
}


